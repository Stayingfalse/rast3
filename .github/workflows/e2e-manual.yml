# Rerun the e2e suite (regression crawl included) against the dev site as
# it stands, without a code change: GitHub › Actions › "E2E on dev (manual)"
# › Run workflow. It never deploys anything (4 Nov).
# It also runs every Monday morning (18 Nov), so a change outside our code
# (a new runner image, an expired secret) shows up within a week even when
# nobody pushes: on 16 Nov ubuntu-latest moved to 26.04 and broke e2e
# silently until the next push.
name: E2E on dev (manual)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-manual
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E on dev (${{ matrix.project }})
    # Pinned (17 Nov): see ci.yml's e2e job
    runs-on: ubuntu-24.04
    # Desktop and mobile run side by side, each in its own test email
    # subdomain (E2E_NS), so their seeds and clean-ups never collide.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      E2E_BASE_URL: https://dev.raosanta.uk
      E2E_TEST_LOGIN_SECRET: ${{ secrets.E2E_TEST_LOGIN_SECRET }}
      # the weekly run has its own test namespace, so it can't collide with a
      # push's e2e run on the same accounts
      E2E_NS: ${{ github.event_name == 'schedule' && format('weekly-{0}', matrix.project) || matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
        env:
          SKIP_ENV_VALIDATION: "1"
      - name: Check the test login secret
        run: |
          if [ -z "$E2E_TEST_LOGIN_SECRET" ]; then
            echo "::warning::E2E_TEST_LOGIN_SECRET is not set for this workflow; signed-in tests will be skipped"
          else
            echo "::notice::E2E_TEST_LOGIN_SECRET is set; running the full suite"
          fi
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.project }}
          path: test-results/
          retention-days: 14
